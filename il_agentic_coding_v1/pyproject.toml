[project]
name = "il-agentic-coding-v1"
version = "0.1.0"
description = "Handcrafted multi-file codebase tasks with IL efficiency-aware reward shaping: cascading bugs, codebase navigation, refactoring, error handling, API impl, dead-code removal, type annotations, perf optimization, config fixes, test-writing."
tags = ["code", "agentic", "il", "intuition-learning", "multi-file", "execution", "v1"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["il_agentic_coding_v1"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 4

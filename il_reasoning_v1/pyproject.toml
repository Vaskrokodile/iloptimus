[project]
name = "il-reasoning-v1"
version = "0.1.0"
description = "Handcrafted pure-reasoning tasks with IL efficiency-aware reward shaping: deterministic verification + reasoning-quality scoring."
tags = ["reasoning", "il", "intuition-learning", "single-turn", "v1"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["il_reasoning_v1"]

[tool.verifiers.eval]
num_examples = 12
rollouts_per_example = 4

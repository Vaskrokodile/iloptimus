[project]
name = "iloptimus"
version = "0.1.0"
description = "IL Optimus — run Intuition Learning pipelines locally with a web frontend. Detects hardware, recommends models, runs SFT+GRPO via mlx_lm/vllm."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "mlx-lm>=0.31.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
iloptimus = "iloptimus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iloptimus"]

[tool.hatch.build.targets.wheel.force-include]
"iloptimus/web/dist" = "iloptimus/web/dist"

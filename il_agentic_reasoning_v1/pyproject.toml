[project]
name = "il-agentic-reasoning-v1"
version = "0.1.0"
description = "Handcrafted multi-step agentic reasoning tasks with IL efficiency-aware reward shaping: cascading traces, cross-module data flow, invariants, race conditions, state machines."
tags = ["reasoning", "agentic", "il", "intuition-learning", "long-horizon", "single-turn", "v1"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["il_agentic_reasoning_v1"]

[tool.verifiers.eval]
num_examples = 10
rollouts_per_example = 4
